name: Auto Commit

on:
  schedule:
    # Multiple random times throughout the day to create unpredictable frequency
    - cron: "15 3 * * *"   # 3:15 AM
    - cron: "42 5 * * *"   # 5:42 AM
    - cron: "28 7 * * *"   # 7:28 AM
    - cron: "5 9 * * *"    # 9:05 AM
    - cron: "33 11 * * *"  # 11:33 AM
    - cron: "17 14 * * *"  # 2:17 PM
    - cron: "51 16 * * *"  # 4:51 PM
    - cron: "8 18 * * *"   # 6:08 PM
    - cron: "44 20 * * *"  # 8:44 PM
    - cron: "22 22 * * *"  # 10:22 PM
    
  workflow_dispatch:  # Manual trigger

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Configure git
        run: |
          git config --local user.email "vijendrasaini@startbitsolutions.com"
          git config --local user.name "Vijendra Kumar Saini"

      - name: Random skip (zigzag effect)
        id: random-skip
        run: |
          # 60% chance to proceed, 40% chance to skip (creates zigzag pattern)
          RANDOM_NUM=$((RANDOM % 100))
          if [ $RANDOM_NUM -lt 60 ]; then
            echo "should_commit=true" >> $GITHUB_OUTPUT
          else
            echo "should_commit=false" >> $GITHUB_OUTPUT
          fi
          echo "Commit decision: $([ $RANDOM_NUM -lt 60 ] && echo 'YES' || echo 'SKIP')"

      - name: Decide commit count (1-3 commits)
        id: commit-count
        if: steps.random-skip.outputs.should_commit == 'true'
        run: |
          # Randomly decide to do 1, 2, or 3 commits this run
          COMMIT_NUM=$((1 + RANDOM % 3))
          echo "num_commits=$COMMIT_NUM" >> $GITHUB_OUTPUT
          echo "Will make $COMMIT_NUM commit(s)"

      - name: Update demo file (Commit 1)
        if: steps.random-skip.outputs.should_commit == 'true'
        run: |
          echo "Update: $(date)" >> demo_test.txt

      - name: Update demo file (Commit 2)
        if: steps.commit-count.outputs.num_commits >= 2
        run: |
          echo "Secondary update: $(date)" >> demo_test.txt

      - name: Update demo file (Commit 3)
        if: steps.commit-count.outputs.num_commits >= 3
        run: |
          echo "Tertiary update: $(date)" >> demo_test.txt
          
      - name: Check for changes
        id: verify-changed-files
        if: steps.random-skip.outputs.should_commit == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          # Large pool of diverse commit messages
          MESSAGES=(
            "Daily Queue process"
            "Blog Queue update"
            "Blog update"
            "Undo changes"
            "Clean code"
            "Process update"
            "New timestamp added"
            "Refactor components"
            "Fix bug in authentication"
            "Update dependencies"
            "Optimize performance"
            "Add new feature"
            "Remove deprecated code"
            "Update documentation"
            "Merge pull request"
            "Fix merge conflicts"
            "Revert previous commit"
            "Code review changes"
            "Improve error handling"
            "Add unit tests"
            "Refactor database queries"
            "Update API endpoints"
            "Fix security vulnerability"
            "Improve user experience"
            "Add logging functionality"
            "Optimize database indexes"
            "Update configuration"
            "Fix responsive design"
            "Add caching layer"
            "Improve build pipeline"
            "Update CI/CD workflow"
            "Fix environment variables"
            "Refactor utility functions"
            "Add new styling"
            "Update package versions"
            "Fix console errors"
            "Improve accessibility"
            "Add analytics tracking"
            "Update backup strategy"
            "Optimize image sizes"
            "Fix browser compatibility"
            "Add rate limiting"
            "Update license information"
            "Refactor authentication flow"
            "Improve code documentation"
            "Fix timezone issues"
            "Add feature flag support"
            "Update monitoring alerts"
            "Refactor error handling"
            "Improve database performance"
            "Add API versioning"
          )
          
          # Select random messages based on number of commits
          for i in $(seq 1 ${{ steps.commit-count.outputs.num_commits }}); do
            # Pick random message
            MSG=${MESSAGES[$((RANDOM % ${#MESSAGES[@]}))]}"
            
            # Add variety to the message
            SUFFIX="[$(date +%s | tail -c 4)]"
            
            git add demo_test.txt
            git commit -m "$MSG $SUFFIX"
            
            # Small delay between commits
            sleep 2
          done
          
          git push
